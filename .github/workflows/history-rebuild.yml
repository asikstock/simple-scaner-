name: ইতিহাস ফাইল যোগের পর ফেজ ও ব্যাকটেস্ট পুনর্গণনা

on:
  push:
    paths:
      - 'history/*.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dse-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: নির্ভরতা
        run: pip install pandas numpy

      - name: history ফাইল যাচাই
        run: python scripts/check_history.py

      - name: ফেজ হিসাব
        run: python -I scripts/compute_phases.py

      - name: ব্যাকটেস্ট (১৩ বছরের ডেটায়)
        run: python -I tools/backtest.py
        continue-on-error: true

      - name: পরিবর্তন সেভ
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/data -A
          if git diff --cached --quiet; then
            echo "পরিবর্তন নেই"
            exit 0
          fi
          git commit -m "data: history rebuild $(date -u +%F\ %H:%M)"
          git pull --rebase -X ours origin main || { git rebase --abort || true; git pull --no-rebase -X ours origin main; }
          git push
